<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Chess Analyzer Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true"><img src="pieces/wN.svg" alt=""></div>
    <div>
      <div class="brand-name">Chess Analyzer Pro</div>
      <div class="brand-sub" data-t="tagline"></div>
    </div>
  </div>
  <div class="top-actions">
    <span class="engine-status" id="engineStatus"><span class="dot"></span><span id="engineText"></span></span>
    <label class="select-wrap"><span data-t="depth"></span>
      <select id="depthSel">
        <option value="12" data-t="depthFast"></option>
        <option value="16" selected data-t="depthNormal"></option>
        <option value="20" data-t="depthDeep"></option>
      </select>
    </label>
    <button class="btn ghost" id="openBtn" hidden data-t="chooseOther"></button>
    <button class="btn ghost" id="langBtn">English</button>
    <button class="btn ghost" id="aboutBtn" data-t="about"></button>
  </div>
</header>

<main id="welcome" class="welcome">
  <div class="welcome-card" id="dropZone">
    <img class="welcome-piece" src="pieces/wN.svg" alt="">
    <h1 data-t="welcomeTitle"></h1>
    <p data-t="welcomeText"></p>
    <button class="btn primary big" id="chooseBtn" data-t="choose"></button>
    <div class="hint" data-t="dropHint"></div>
    <div class="error" id="welcomeError" hidden></div>
  </div>
</main>

<main id="workspace" class="workspace" hidden>
  <section class="board-col">
    <div class="player" id="playerTop"></div>
    <div class="board-row">
      <div class="evalbar" id="evalbar">
        <div class="evalbar-white" id="evalWhite"></div>
        <div class="evalbar-num" id="evalNum"></div>
      </div>
      <div class="board-wrap">
        <div class="board" id="board"></div>
        <svg class="arrows" id="arrows" viewBox="0 0 8 8"></svg>
        <div class="badge-layer" id="badgeLayer"></div>
        <div class="toast" id="toast" hidden></div>
      </div>
    </div>
    <div class="player" id="playerBottom"></div>
    <div class="nav">
      <button class="btn nav-btn" id="firstBtn" data-title="first">⏮</button>
      <button class="btn nav-btn" id="prevBtn" data-title="prev">◀</button>
      <button class="btn nav-btn" id="nextBtn" data-title="next">▶</button>
      <button class="btn nav-btn" id="lastBtn" data-title="last">⏭</button>
      <button class="btn nav-btn" id="autoBtn" data-title="autoplay">⏵</button>
      <span class="nav-gap"></span>
      <button class="btn nav-btn" id="flipBtn" data-title="flip">⇅</button>
      <label class="toggle"><input type="checkbox" id="arrowsChk" checked><span data-t="arrows"></span></label>
      <label class="toggle"><input type="checkbox" id="badgesChk" checked><span data-t="badges"></span></label>
      <label class="toggle"><input type="checkbox" id="soundChk" checked><span data-t="sounds"></span></label>
    </div>
    <div class="varbar" id="varBar"></div>
  </section>

  <aside class="side"><div class="side-grid">
    <div class="progress" id="progress">
      <div class="progress-label"><span id="progressText"></span><span id="progressPct"></span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="card c-summary">
      <h2 data-t="summary"></h2>
      <div class="acc-row">
        <div class="acc white"><div class="acc-name" id="accWName"></div><div class="acc-val" id="accW">–</div></div>
        <div class="acc-mid" data-t="accuracy"></div>
        <div class="acc black"><div class="acc-name" id="accBName"></div><div class="acc-val" id="accB">–</div></div>
      </div>
      <svg class="graph" id="graph" viewBox="0 0 100 30" preserveAspectRatio="none"></svg>
      <div class="counts" id="counts"></div>
      <div class="review-extra" id="reviewExtra"></div>
    </div>

    <div class="card c-quality">
      <h2 data-t="moveQuality"></h2>
      <div class="quality" id="quality"></div>
    </div>

    <div class="card c-lines">
      <h2 data-t="engineLines"></h2>
      <div class="lines" id="lines"></div>
    </div>

    <div class="card grow c-moves">
      <h2 data-t="moves"></h2>
      <div class="movelist" id="movelist" dir="ltr"></div>
    </div>
  </div></aside>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-body" id="modalBody"></div>
    <button class="btn primary" id="modalClose" data-t="close"></button>
  </div>
</div>

<script src="bundle.js"></script>
</body>
</html>
